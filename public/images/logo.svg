<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" style="background: transparent;">
    <!-- Outer Circle -->
    <circle cx="250" cy="250" r="225" fill="transparent" stroke="#656C75" stroke-width="3.5" />

    <!-- Central "V" Emblem -->
    <g id="v-emblem">
        <!-- Left Wing (Deep Navy Blue) -->
        <path d="M 170,135 L 215,135 L 205,160 L 250,182 L 250,268 Z" fill="#002B66" />
        
        <!-- Right Wing (Vibrant Orange) -->
        <path d="M 330,135 L 285,135 L 295,160 L 250,182 L 250,268 Z" fill="#FF5500" />
    </g>

    <!-- Main Title: VELSEN -->
    <text x="250" y="318" 
          font-family="'Hanken Grotesk', 'Manrope', 'Montserrat', 'Arial', sans-serif" 
          font-size="50" 
          font-weight="900" 
          fill="#002B66" 
          text-anchor="middle" 
          letter-spacing="3">VELSEN</text>

    <!-- Separator Accent -->
    <g id="separator">
        <line x1="165" y1="338" x2="236" y2="338" stroke="#FF5500" stroke-width="2.2" stroke-linecap="round" />
        <circle cx="250" cy="338" r="4.5" fill="#FF5500" />
        <line x1="264" y1="338" x2="335" y2="338" stroke="#FF5500" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <!-- Subtitle: PROFESSIONAL CLEANING SERVICES -->
    <text x="250" y="362" 
          font-family="'Hanken Grotesk', 'Manrope', 'Montserrat', 'Arial', sans-serif" 
          font-size="13" 
          font-weight="800" 
          fill="#002B66" 
          text-anchor="middle" 
          letter-spacing="1.5">PROFESSIONAL CLEANING SERVICES</text>
</svg>
