<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF9E" />
      <stop offset="45%" stop-color="#FDCA56" />
      <stop offset="80%" stop-color="#795900" />
      <stop offset="100%" stop-color="#5B4300" />
    </linearGradient>
    
    <!-- Deep Navy Gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#002F6C" />
      <stop offset="100%" stop-color="#001B44" />
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Border -->
  <path d="M 100,20 L 165,45 C 165,115 135,160 100,180 C 65,160 35,115 35,45 Z" 
        fill="url(#navyGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="5" 
        stroke-linejoin="round" />

  <!-- Inner Shield Accent Line -->
  <path d="M 100,28 L 157,50 C 157,112 130,152 100,170 C 70,152 43,112 43,50 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="1.5" 
        opacity="0.6" />

  <!-- Rays / Sparkle Beam inside shield -->
  <path d="M 100,85 L 60,155 L 72,158 L 100,105 L 128,158 L 140,155 Z" 
        fill="url(#goldGrad)" 
        opacity="0.85" />
  
  <path d="M 100,85 L 82,158 L 92,160 L 100,110 L 108,160 L 118,158 Z" 
        fill="url(#goldGrad)" />

  <!-- Center Diamond Sparkle -->
  <g transform="translate(100, 75)" filter="url(#goldGlow)">
    <!-- 4-point Star -->
    <path d="M 0,-30 Q 0,0 30,0 Q 0,0 0,30 Q 0,0 -30,0 Q 0,0 0,-30 Z" fill="url(#goldGrad)" />
    <!-- Diagonal sparkle -->
    <path d="M 0,-15 Q 0,0 15,0 Q 0,0 0,15 Q 0,0 -15,0 Q 0,0 0,-15 Z" fill="#FFF5D6" transform="rotate(45)" />
    <!-- Center core -->
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
